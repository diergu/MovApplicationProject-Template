<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="580" viewBox="0 0 1280 580" role="img" aria-labelledby="title desc">
  <title id="title">Gráfico de Gantt do projeto Bem Próximo</title>
  <desc id="desc">Cronograma de 62 dias úteis, organizado em treze semanas. As barras em vermelho indicam o caminho crítico.</desc>
  <style>
    .title { font: 700 24px Arial, sans-serif; fill: #172b4d; }
    .subtitle { font: 14px Arial, sans-serif; fill: #52606d; }
    .header { font: 700 13px Arial, sans-serif; fill: #172b4d; }
    .label { font: 14px Arial, sans-serif; fill: #172b4d; }
    .duration { font: 13px Arial, sans-serif; fill: #52606d; }
    .small { font: 12px Arial, sans-serif; fill: #52606d; }
  </style>
  <rect width="1280" height="580" fill="#ffffff"/>
  <text x="36" y="42" class="title">Cronograma do projeto Bem Próximo</text>
  <text x="36" y="66" class="subtitle">Estimativa em dias úteis — duração total prevista: 62 dias</text>

  <rect x="36" y="94" width="1208" height="40" fill="#eaf0f6"/>
  <text x="54" y="119" class="header">ATIVIDADE</text>
  <text x="255" y="119" class="header">DURAÇÃO</text>
  <text x="350" y="119" class="header">SEMANA</text>

  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="350" y1="94" x2="350" y2="532"/>
    <line x1="416" y1="94" x2="416" y2="532"/>
    <line x1="482" y1="94" x2="482" y2="532"/>
    <line x1="548" y1="94" x2="548" y2="532"/>
    <line x1="614" y1="94" x2="614" y2="532"/>
    <line x1="680" y1="94" x2="680" y2="532"/>
    <line x1="746" y1="94" x2="746" y2="532"/>
    <line x1="812" y1="94" x2="812" y2="532"/>
    <line x1="878" y1="94" x2="878" y2="532"/>
    <line x1="944" y1="94" x2="944" y2="532"/>
    <line x1="1010" y1="94" x2="1010" y2="532"/>
    <line x1="1076" y1="94" x2="1076" y2="532"/>
    <line x1="1142" y1="94" x2="1142" y2="532"/>
    <line x1="1208" y1="94" x2="1208" y2="532"/>
  </g>
  <g class="header" text-anchor="middle">
    <text x="383" y="119">1</text><text x="449" y="119">2</text><text x="515" y="119">3</text>
    <text x="581" y="119">4</text><text x="647" y="119">5</text><text x="713" y="119">6</text>
    <text x="779" y="119">7</text><text x="845" y="119">8</text><text x="911" y="119">9</text>
    <text x="977" y="119">10</text><text x="1043" y="119">11</text><text x="1109" y="119">12</text><text x="1175" y="119">13</text>
  </g>

  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="36" y1="178" x2="1244" y2="178"/><line x1="36" y1="222" x2="1244" y2="222"/>
    <line x1="36" y1="266" x2="1244" y2="266"/><line x1="36" y1="310" x2="1244" y2="310"/>
    <line x1="36" y1="354" x2="1244" y2="354"/><line x1="36" y1="398" x2="1244" y2="398"/>
    <line x1="36" y1="442" x2="1244" y2="442"/><line x1="36" y1="486" x2="1244" y2="486"/>
    <line x1="36" y1="532" x2="1244" y2="532"/>
  </g>
  <g class="label">
    <text x="54" y="162">A · Planejamento</text><text x="54" y="206">B · Requisitos</text>
    <text x="54" y="250">C · Protótipo</text><text x="54" y="294">D · Arquitetura</text>
    <text x="54" y="338">E · Desenvolvimento</text><text x="54" y="382">F · Documentação</text>
    <text x="54" y="426">G · Integração</text><text x="54" y="470">H · Testes e correções</text>
    <text x="54" y="514">I · Entrega</text>
  </g>
  <g class="duration" text-anchor="end">
