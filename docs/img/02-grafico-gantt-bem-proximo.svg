    <text x="325" y="294">7 dias</text><text x="325" y="338">20 dias</text><text x="325" y="382">15 dias</text>
    <text x="325" y="426">7 dias</text><text x="325" y="470">10 dias</text><text x="325" y="514">3 dias</text>
  </g>

  <!-- Caminho crítico: A, B, C, E, G, H e I. Cada dia útil possui 13,2 px. -->
  <g>
    <rect x="350" y="145" width="66" height="22" rx="3" fill="#b42318"/><rect x="416" y="189" width="92.4" height="22" rx="3" fill="#b42318"/>
    <rect x="508.4" y="233" width="132" height="22" rx="3" fill="#b42318"/><rect x="508.4" y="277" width="92.4" height="22" rx="3" fill="#2563eb"/>
    <rect x="640.4" y="321" width="264" height="22" rx="3" fill="#b42318"/><rect x="508.4" y="365" width="198" height="22" rx="3" fill="#2563eb"/>
    <rect x="904.4" y="409" width="92.4" height="22" rx="3" fill="#b42318"/><rect x="996.8" y="453" width="132" height="22" rx="3" fill="#b42318"/>
    <rect x="1128.8" y="497" width="39.6" height="22" rx="3" fill="#b42318"/>
  </g>
  <g class="small">
    <rect x="900" y="552" width="14" height="14" rx="2" fill="#b42318"/><text x="920" y="564">Caminho crítico</text>
    <rect x="1065" y="552" width="14" height="14" rx="2" fill="#2563eb"/><text x="1085" y="564">Atividade paralela</text>
  </g>
